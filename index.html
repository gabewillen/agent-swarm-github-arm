<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quorum Run</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111111;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* The game canvas fills the window; src/main.js sizes its backing store. */
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="600">Quorum Run needs a canvas.</canvas>
<script type="module" src="src/main.js"></script>
</body>
</html>
