# The GitHub arm's CI: the required check `test` (job `test`) runs ci/check.sh
# on every pull request (GitHub tests the PR merged into main) and on every
# merge-queue build branch mq/<n> the queue worker pushes (kit/queue).
name: test
on:
  pull_request:
  push:
    branches: ["mq/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: sh ci/check.sh
